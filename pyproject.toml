[project]
name = "rl_games"
version = "2.0.0"
description = "High-performance PyTorch reinforcement learning: PPO and SAC for GPU-vectorized simulators (MJLab, Isaac Lab), envpool and gymnasium"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Denys Makoviichuk", email = "trrrrr97@gmail.com"},
    {name = "Viktor Makoviichuk", email = "victor.makoviychuk@gmail.com"},
]
# Python classifiers track the CI matrix (.github/workflows/python-package.yml)
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7.0",  # floor matches Isaac Lab / Isaac Sim 5.1 (torch 2.7 pin); dev lock pins 2.12
    "gymnasium>=1.0.0",
    "numpy>=2.0",  # direct dependency (31 imports); 2.x is the tested stack (dev lock 2.4), 1.x is untested
    "tensorboard>=2.8.0",
    "tensorboardX>=2.5",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "setproctitle>=1.2.2",
    "opencv-python>=4.5.5",
    "wandb>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/Denys88/rl_games"
Repository = "https://github.com/Denys88/rl_games"
Documentation = "https://github.com/Denys88/rl_games/tree/master/docs"
Issues = "https://github.com/Denys88/rl_games/issues"

[project.optional-dependencies]
atari = ["ale-py>=0.8", "AutoROM[accept-rom-license]>=0.4.2"]
mujoco = ["mujoco>=3.0.0", "imageio"]
# envpool 1.2.6 (randomized MyoSuite resets, envpool#432) ships wheels for
# Python >= 3.12 only; Python 3.11 falls back to 1.2.5 (first release
# verified against numpy 2.x), whose MyoSuite resets are deterministic --
# see docs/MYOSUITE.md. The <1.2.6 cap on the 3.11 fork is explicit, not
# required: 1.2.6 is Requires-Python >= 3.12 with no sdist, so 3.11 can
# never resolve it; the cap also keeps 3.11 on 1.2.5 should a later 1.2.x
# ship cp311 wheels (revisit then). Drop the fallback once the project
# floor moves to 3.12 (currently held at 3.11 for Isaac Lab / Isaac Sim 5.1).
envpool = [
    "envpool>=1.2.6; python_version >= '3.12'",
    "envpool>=1.2.5,<1.2.6; python_version < '3.12'",
]
# pufferlib releases up to 3.0.0 pin numpy<2.0 and gymnasium<=0.29.1, which
# conflicts with this project's floors, so it cannot be a resolvable extra yet.
# pufferlib 4.0 drops those pins (core deps: torch>=2.9, unpinned numpy) --
# restore the extra as pufferlib>=4.0 once it ships on PyPI.
# Until then: pip install pufferlib --no-deps

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license expression (License-Expression in METADATA)
build-backend = "hatchling.build"

# The sdist is what PyPI serves for source installs: sources, configs, tests,
# benchmarks and the docs text. Notebooks (25 MB) and docs/pictures (17 MB)
# stay on GitHub -- with them the 2.0.0 sdist was 25 MB against 127 KB for 1.6.5.
[tool.hatch.build.targets.sdist]
exclude = [
    "notebooks/",
    "docs/pictures/",
    "*.png",
    "*.gif",
    "uv.lock",
    ".github/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
