# SAC with the FlashSAC recipe on the point-mass tracking task (two action groups).
# Learner settings of a large-scale bimanual tracking run: 2048 envs, 2 updates of 4096 per env
# step, n-step 5 at gamma 0.98, a 101-bin ensemble critic with one twin pair and one temperature
# per action group, return-based reward scaling, held exploration noise, cosine LR.
# For a simulator task set env_name / num_actors, the obs_window layout and action_groups
# (or let the env report env_info['action_groups']); the env provides infos['reward_heads'] (B, H),
# infos['time_outs'] and infos['final_observation'] (same-step autoreset).
#   python runner.py --train --file rl_games/configs/sac_flash_point_mass.yaml
#   torchrun --standalone --nproc_per_node=4 runner.py --train --file ... (with multi_gpu: True)

params:
  seed: 42

  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: flash_sac
    actor:          # one tower per action group
      units: 128
      blocks: 2
    critic:         # 2 x groups ensemble members
      units: 1024
      blocks: 2
      num_bins: 101 # categorical value head on [v_min, v_max]; 0 = scalar Q with MSE
      v_min: -5.0
      v_max: 5.0
    expansion: 4
    bn_momentum: 0.01
    log_std_bounds: [-5.0, 0.0]
    obs_window:     # Conv1d encoder over the last `size` obs columns, laid out (steps, size / steps)
      size: 40
      steps: 10
      hidden: 128
      latent: 128

  config:
    name: point_mass_flash_sac
    env_name: point_mass_tracking
    env_config:
      num_groups: 2
      device: cuda:0
    device: cuda:0
    num_actors: 2048
    max_frames: 100_000_000
    num_steps_per_episode: 32
    save_best_after: 100
    save_frequency: 300
    normalize_input: False      # batch norm on the input instead
    reward_shaper:
      scale_value: 1.0

    action_groups:              # per group: one actor tower, Q pair, reward head and temperature
      first: [0, 2]
      second: [1, 3]

    gamma: 0.98
    n_step: 5
    critic_tau: 0.01
    batch_size: 4096
    num_updates_per_step: 2
    policy_frequency: 2
    num_warmup_frames: 100_000
    critic_grad_clip: 0

    replay_buffer_size: 50_000_000
    replay_memory_efficient: True
    replay_obs_dtype: float16
    replay_storage: device      # host: page-locked RAM read by the GPU

    init_alpha: 0.01
    learnable_temperature: True
    min_alpha: 0.0
    target_entropy_sigma: 0.15  # per normalized action dim

    actor_lr: 3e-4
    critic_lr: 3e-4
    alpha_lr: 3e-4
    lr_schedule: cosine
    lr_warmup_steps: 0
    lr_end_factor: 0.5
    lr_per_optimizer_step: False  # True: actor / temperature schedules advance with their own (half-rate) steps

    normalize_reward: True
    normalized_return_max: 5.0
    held_noise: True
    held_noise_zeta_mu: 2.0
    held_noise_max_steps: 16

    mixed_precision: fp16
    torch_compile: default      # fused network kernels
    update_cuda_graph: True     # each update replayed as one CUDA graph
    multi_gpu: False            # True under torchrun: one rank per GPU, own envs and replay, gradients averaged

    player:
      deterministic: True
      games_num: 100
