params:
  seed: 5
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 512
      - 256
      - 128
      activation: elu
      initializer:
        name: default
  config:
    name: MyoHandReorient8
    env_name: envpool
    mixed_precision: true
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    reward_shaper:
      scale_value: 1
      log_val: false
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    clip_value: true
    use_smooth_clamp: false
    bound_loss_type: regularisation
    bounds_loss_coef: 0.001
    max_epochs: 10000
    num_actors: 64
    horizon_length: 128
    minibatch_size: 128
    mini_epochs: 5
    critic_coef: 4
    use_diagnostics: false
    env_config:
      env_name: MyoSuite/myoFingerPoseRandom-v0
    player: {}
    min_lr: 1.0e-05
    max_lr: 0.001
