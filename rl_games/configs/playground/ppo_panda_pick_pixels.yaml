# mujoco_playground PandaPickCubeCartesian from 64x64 PIXELS — pixel STUDENT
# trained from scratch (CNN), no teacher. Baseline for ppo_panda_pick_pixels_distill.yaml.
# ~5.8k env-steps/s at 1024 worlds (physics-bound).
#
#   LD_LIBRARY_PATH=/usr/lib/wsl/lib python scripts/playground_train.py -f rl_games/configs/playground/ppo_panda_pick_pixels.yaml
params:
  seed: 7

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
    cnn:
      permute_input: True        # obs arrives (B, H, W, C) uint8
      type: conv2d
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None
      convs:
        - filters: 32
          kernel_size: 5
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 0
    mlp:
      units: [256, 128]
      activation: elu
      initializer:
        name: default
  config:
    name: panda_pick_pixels
    env_name: playground
    device: cuda

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: True
    normalize_input: False     # uint8 pixels are scaled by 1/255 in _preproc_obs
    normalize_value: True
    value_bootstrap: True

    gamma: 0.97
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01

    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    entropy_coef: 0.001
    critic_coef: 1.0
    bounds_loss_coef: 0.0001
    clip_value: True

    num_actors: 1024
    horizon_length: 32
    minibatch_size: 8192
    mini_epochs: 4

    max_epochs: 300
    save_best_after: 20
    save_frequency: 50
    score_to_win: 100000
    games_to_track: 500

    env_config:
      env_name: PandaPickCubeCartesian
      obs: pixels
      cam_res: [64, 64]
      seed: 7
