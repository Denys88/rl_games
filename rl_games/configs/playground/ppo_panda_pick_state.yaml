# mujoco_playground PandaPickCubeCartesian, privileged 66-d STATE — the TEACHER
# for the pixel student (rl_games/common/distillation.py). Continuous PPO,
# MLP. 1024 worlds on GPU (MJX + Warp), ~6.7k env-steps/s; 300 epochs x 32768
# frames = ~10M frames (~25 min).
#
#   LD_LIBRARY_PATH=/usr/lib/wsl/lib python scripts/playground_train.py -f rl_games/configs/playground/ppo_panda_pick_state.yaml
params:
  seed: 7

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
    mlp:
      units: [256, 256, 256]
      activation: elu
      initializer:
        name: default

  config:
    name: panda_pick_state
    env_name: playground
    device: cuda

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True

    gamma: 0.97
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01

    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    entropy_coef: 0.001
    critic_coef: 1.0
    bounds_loss_coef: 0.0001
    clip_value: True

    num_actors: 1024
    horizon_length: 32
    minibatch_size: 8192
    mini_epochs: 4

    max_epochs: 300
    save_best_after: 20
    save_frequency: 50
    score_to_win: 100000
    games_to_track: 500

    env_config:
      env_name: PandaPickCubeCartesian
      obs: state
      seed: 7
