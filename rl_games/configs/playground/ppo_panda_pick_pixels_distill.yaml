# mujoco_playground PandaPickCubeCartesian: 64x64 PIXEL student DISTILLED from
# the 66-d state teacher (ppo_panda_pick_state.yaml). Env returns
# {'obs': pixels, 'states': state}; the teacher and the central value net
# consume states; the central value net is the teacher's MLP, warm-started.
# Continuous actions: KL between the diagonal Gaussians.
#
# Schedule (epochs): 0-60 pure DAgger (ppo_coef 0, beta 0.5 -> 0 by 30),
# 60-150 PPO fine-tune with the KL fading to 0, then PPO alone.
#
#   LD_LIBRARY_PATH=/usr/lib/wsl/lib python scripts/playground_train.py -f rl_games/configs/playground/ppo_panda_pick_pixels_distill.yaml
params:
  seed: 7

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
    cnn:
      permute_input: True        # obs arrives (B, H, W, C) uint8
      type: conv2d
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None
      convs:
        - filters: 32
          kernel_size: 5
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 0
    mlp:
      units: [256, 128]
      activation: elu
      initializer:
        name: default
  config:
    name: panda_pick_pixels_distill
    env_name: playground
    device: cuda

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: True
    normalize_input: False     # uint8 pixels are scaled by 1/255 in _preproc_obs
    normalize_value: True
    value_bootstrap: True

    gamma: 0.97
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01

    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    entropy_coef: 0.001
    critic_coef: 1.0
    bounds_loss_coef: 0.0001
    clip_value: True

    num_actors: 1024
    horizon_length: 32
    minibatch_size: 8192
    mini_epochs: 4

    max_epochs: 300
    save_best_after: 20
    save_frequency: 50
    score_to_win: 100000
    games_to_track: 500

    central_value_config:
      minibatch_size: 8192
      mini_epochs: 4
      learning_rate: 3.0e-4
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [256, 256, 256]
          activation: elu
          initializer:
            name: default

    distillation:
      teacher_config: rl_games/configs/playground/ppo_panda_pick_state.yaml
      teacher_checkpoint: runs/panda_pick_state_05-16-08-49/nn/panda_pick_state.pth
      loss: kl
      coef: [[0, 1.0], [60, 1.0], [150, 0.0]]
      ppo_coef: [[0, 0.0], [60, 0.0], [61, 1.0]]
      beta: [[0, 0.5], [30, 0.0]]
      warm_start_value: True

    env_config:
      env_name: PandaPickCubeCartesian
      obs: both
      cam_res: [64, 64]
      seed: 7
