# Craftax-Classic PIXELS (63x63x3) — pixel STUDENT trained from scratch, no
# teacher. Baseline for ppo_craftax_classic_pixels_distill.yaml.
#
#   python scripts/craftax_train.py -f rl_games/configs/craftax/ppo_craftax_classic_pixels.yaml
params:
  seed: 7

  algo:
    name: a2c_discrete

  model:
    name: discrete_a2c

  network:
    name: actor_critic
    separate: False
    space:
      discrete:
    cnn:
      permute_input: True        # obs arrives (B, H, W, C) uint8
      type: conv2d
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None
      convs:
        - filters: 32
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 64
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 0
    mlp:
      units: [512]
      activation: elu
      initializer:
        name: default
  config:
    name: craftax_classic_pixels
    env_name: craftax
    device: cuda

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: True
    normalize_input: False     # uint8 pixels are scaled by 1/255 in _preproc_obs
    normalize_value: True
    value_bootstrap: False

    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01

    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    entropy_coef: 0.01
    critic_coef: 1.0
    clip_value: True

    num_actors: 1024
    horizon_length: 64
    minibatch_size: 8192
    mini_epochs: 4

    max_epochs: 1500
    save_best_after: 50
    save_frequency: 250
    score_to_win: 100000
    games_to_track: 500

    env_config:
      game: Craftax-Classic-v1
      obs: pixels
      seed: 7
