# b18c384nbt-scale (27.5M params) PPO league training from scratch.
# Same recipe that produced the small-net champion, two phases driven by
# scripts/go_big_run.py: plain league first, search-strengthened league last.
params:
  seed: 322

  algo:
    name: a2c_discrete

  model:
    name: discrete_a2c

  network:
    name: go_resnet
    block_type: nbt
    blocks: 18
    channels: 384
    bottleneck_channels: 192
    gpool_every: 3
    value_units: 256
    aux_heads: [ownership, score_dist, opp_policy, plies_left]
    aux_weights:
      ownership: 1.0
      score_dist: 0.25
      opp_policy: 0.15
      plies_left: 0.05
    aux_anneal_to: 0.5

  config:
    name: go9_big
    env_name: pgx_go
    reward_shaper:
      scale_value: 1.0
    device: cuda
    use_action_masks: True
    mixed_precision: True
    normalize_input: False
    normalize_value: True
    normalize_advantage: True
    gamma: 1.0
    tau: 0.97
    learning_rate: 2e-4
    lr_schedule: linear
    min_lr: 2e-4
    schedule_entropy: True
    min_entropy_coef: 0.002
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    clip_value: False
    critic_coef: 1
    # NOTE: 4096 actors and/or minibatch >=4096 with this 27.5M net either
    # OOM (torch activations + XLA peaks collide) or stall 40+ min in
    # jit/cudnn autotune at ~30GB. 2048/2048 is measured-good: 15s/epoch.
    num_actors: 2048
    horizon_length: 16
    minibatch_size: 2048
    mini_epochs: 2
    max_epochs: 4000
    save_best_after: 100
    save_frequency: 250
    score_to_win: 1000
    games_to_track: 2048

    league:
      max_pool: 24
      snapshot_every: 100
      snapshot_if_winrate: 0.55
      snapshot_dominance: 0.70
      remap_every: 10
      push_main_every: 5
      matchmaking: {p_self: 0.35, p_pfsp: 0.50, p_uniform: 0.15}
      pfsp: {mode: hard, floor: 0.02}

    env_config:
      komi: 7.0
      opponent: pool
      pool_groups: 16
      block_type: nbt
      blocks: 18
      channels: 384
      bottleneck_channels: 192
      gpool_every: 3
      value_units: 256
      opponent_temperature: 1.0
      symmetry: True
      pass_mask_moves: 20
      score_reward_w: 0.5
      seed: 322

    player:
      games_num: 512
      deterministic: True
      use_vecenv: True
