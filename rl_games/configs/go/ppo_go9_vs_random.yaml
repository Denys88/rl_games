# Phase 0/1 sanity: PPO vs random legal-move opponent on pgx Go 9x9.
# Acceptance: >95% win rate vs random within ~30 minutes.
params:
  seed: 322

  algo:
    name: a2c_discrete

  model:
    name: discrete_a2c

  network:
    name: go_resnet
    blocks: 6
    channels: 64
    gpool_every: 2
    value_units: 128
    aux_heads: [ownership, score_dist, opp_policy, plies_left]
    aux_weights:
      ownership: 1.0
      score_dist: 0.25
      opp_policy: 0.15
      plies_left: 0.05
    aux_anneal_to: 0.5

  config:
    name: go9_vs_random
    env_name: pgx_go
    reward_shaper:
      scale_value: 1.0
    device: cuda
    use_action_masks: True
    normalize_input: False
    normalize_value: True
    normalize_advantage: True
    gamma: 1.0
    tau: 0.97
    learning_rate: 3e-4
    lr_schedule: None
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    clip_value: False
    critic_coef: 1
    num_actors: 4096
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 2
    max_epochs: 500
    save_best_after: 20
    save_frequency: 100
    score_to_win: 1000

    env_config:
      komi: 7.0
      opponent: random
      symmetry: True
      pass_mask_moves: 20
      score_reward_w: 0.5
      seed: 322

    player:
      games_num: 512
      deterministic: True
