params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.05
        fixed_sigma: true    # global exploration std: see docs/MJLAB.md, stability notes
        min_sigma: 0.2
        sigma_parametrization: softplus
    mlp:
      units:
      - 1024
      - 512
      - 256
      activation: elu
      initializer:
        name: default
  config:
    name: MJLab_WujiHand_Reorient
    env_name: mjlab_wujihand
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0001
    grad_norm: 1.0
    entropy_coef: 0.0    # a positive bonus on a global std runs away over long runs
    truncate_grads: true
    e_clip: 0.2
    clip_value: false
    num_actors: 8192
    horizon_length: 40
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 0.5
    use_smooth_clamp: true
    bound_loss_type: regularisation
    bounds_loss_coef: 0.001
    device: cuda:0
    max_epochs: 5000
    env_config:
      task_name: WujiHand_Reorient
      device: cuda
    player:
      render: false
    save_frequency: 500
    save_best_after: 100
    # adaptive rate driven by the KL of the optimizer step itself (an extra
    # no-grad forward after each step), averaged over a mini-epoch before the
    # rule acts. Beat a fixed 1e-4 on every seed and the legacy reference-KL
    # scheduler by a wide margin on this task (docs/MJLAB.md). Keep
    # schedule_type standard: per-minibatch stepping on this signal ratchets
    # the rate to the floor on tail events.
    lr_schedule: adaptive
    kl_schedule_source: optimizer_step
    schedule_type: standard
    kl_threshold: 0.002    # calibrated on the fixed-rate run's step KL (0.002 before takeoff, 0.003 after)
    min_lr: 5.0e-05
    max_lr: 2.0e-04
    lr_multiplier: 1.5
    central_value_config:
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 0.0001
      kl_threshold: 0.01
      clip_value: true
      normalize_input: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units:
          - 1024
          - 1024
          - 512
          - 256
          activation: elu
          initializer:
            name: default
      truncate_grads: true
      grad_norm: 1.0
    vecenv_type: MJLAB
    algo_observer: isaac
    clip_actions: false
