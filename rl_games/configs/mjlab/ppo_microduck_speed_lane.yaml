params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 512
      - 256
      - 128
      activation: elu
      initializer:
        name: default
  config:
    name: MJLab_MicroDuck_SpeedLane
    env_name: mjlab_microduck_velocity
    normalize_input: true
    # value normalization: 147.7 vs 144.1 final return (means of 3 seeds); the
    # task's penalty weights ramp with the curriculum, so the return scale
    # shifts during training
    normalize_value: true
    # 20 s episodes end in truncation, not failure: bootstrap is essential
    value_bootstrap: true
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.001
    lr_schedule: adaptive
    kl_threshold: 0.01
    # explicit adaptive-LR band (these are the scheduler defaults; stated
    # so the recipe is self-documenting)
    min_lr: 1.0e-6
    max_lr: 1.0e-3
    grad_norm: 1.0
    # MUST stay 0 on the free per-dim logstd head (fixed_sigma: true):
    # a constant positive entropy bonus puts a persistent gradient on the
    # logstd parameter and Adam grows sigma exponentially -> collapse.
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    clip_value: false
    # mjlab scales/clamps position targets in the env; rl_games' default
    # pre-clamp to [-1, 1] would distort both the actions and the KL the
    # adaptive LR reads
    clip_actions: false
    num_actors: 16384
    horizon_length: 24
    minibatch_size: 32768  # 16384 envs x 24 steps / 12 minibatches
    mini_epochs: 5
    critic_coef: 1
    use_smooth_clamp: true
    bound_loss_type: regularisation
    bounds_loss_coef: 0.0
    device: cuda:0
    max_epochs: 2000
    save_best_after: 100
    env_config:
      # Task plugin: github.com/ViktorM/microduck_rl, branch speed-lane. Gait16k is
      # the velocity task with a tracking-gated forward-command curriculum and a
      # touchdown-stride gait term. Install steps in docs/MJLAB.md.
      task_name: Mjlab-Velocity-Flat-MicroDuck-Gait16k
      device: cuda
    player:
      render: false
    save_frequency: 500
    schedule_type: standard
    central_value_config:
      minibatch_size: 24576
      mini_epochs: 5
      learning_rate: 0.001
      clip_value: true
      normalize_input: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units:
          - 512
          - 256
          - 128
          activation: elu
          initializer:
            name: default
      truncate_grads: true
      grad_norm: 1.0
    vecenv_type: MJLAB
    algo_observer: isaac
    # mirror-consistency loss on the policy mean (docs/CONFIG_PARAMS.md)
    symmetry_loss:
      coef: 0.5
      maps: mjlab_microduck.tasks.symmetry:mirror_maps
